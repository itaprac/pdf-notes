[project]
name = "pdf-notes"
version = "0.1.0"
description = "Mark up PDFs in the browser and collect notes as JSON and Markdown"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []

[project.scripts]
pdf-notes = "pdf_notes.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdf_notes"]
