<script>
  (() => {
    const system = matchMedia("(prefers-color-scheme: dark)");
    let theme = "system";
    try { theme = localStorage.getItem("pdf-notes-theme") || "system"; } catch {}
    document.documentElement.dataset.theme = theme === "dark" || (theme === "system" && system.matches) ? "dark" : "light";
  })();
</script>
<style>

    --accent: #4d8cf5; --accent-hover: #6a9ff7; --accent-solid: #2563eb; --accent-solid-hover: #1f5bd8; --accent-ink: #fff; --accent-soft: rgba(77, 140, 245, .16); --ring: rgba(77, 140, 245, .45);

  .lib-empty { text-align: center; color: var(--muted); padding: 28px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }

  #stage { flex: 1; position: relative; min-width: 0; }

  #pages { display: flex; flex-direction: column; align-items: center; gap: 30px; }
  .page { position: relative; background: #fff; color-scheme: light; box-shadow: 0 1px 3px rgba(16, 24, 40, .12), 0 4px 14px rgba(16, 24, 40, .08); }
  .page canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  :root[data-theme="dark"] .page { background: #1a1a1a; box-shadow: 0 1px 3px rgba(0, 0, 0, .5), 0 4px 14px rgba(0, 0, 0, .35); }
  :root[data-theme="dark"] .page canvas { filter: invert(.9) hue-rotate(180deg); }
  :root[data-theme="dark"] .hl { mix-blend-mode: screen; }
  .page .hl-layer { position: absolute; inset: 0; pointer-events: none; z-index: 0; }

  .hl.rejected { background: var(--hl-rej); } .hl.area.rejected { border-color: #aaa; background: transparent; }

  .pin { position: absolute; right: -32px; transform: translateY(-2px); pointer-events: auto; cursor: pointer;
         min-width: 22px; height: 22px; border-radius: 11px; background: var(--mark); color: #1b1d22; font-size: 11px; font-weight: 700;
         display: flex; align-items: center; justify-content: center; padding: 0 6px; box-shadow: 0 0 0 2px var(--bg), var(--shadow);
         font-variant-numeric: tabular-nums; transition: transform .12s; }

           width: max-content; max-width: calc(100% - 24px); }

  /* side panel */

  #side .seg { width: 100%; }

  .chip.done { background: var(--done-bg); color: var(--done-ink); } .chip.rejected { background: var(--rej-bg); color: var(--rej-ink); }

                 display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .card .kind { display: inline-flex; align-items: center; gap: 5px; margin: 8px 0 4px; font-size: 12px; color: var(--muted); }

  .card .note .none { color: var(--faint); font-style: italic; }

  .card .acts .spacer { flex: 1; }
  .card .acts .btn { color: var(--muted); }
  @media (hover: hover) {
    .card .acts .btn { opacity: .72; }
    .card:hover .acts .btn, .card.sel .acts .btn, .card .acts .btn:focus-visible { opacity: 1; }
  }
  .export { padding: 10px 12px; border-top: 1px solid var(--line); display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .export .wide { grid-column: 1 / -1; }
  .help { font-size: 12px; color: var(--muted); padding: 0 12px 12px; }
  .help summary { cursor: pointer; list-style: none; display: inline-flex; align-items: center; gap: 5px; padding: 2px 0; user-select: none; }
  .help summary::-webkit-details-marker { display: none; }
  .help summary:hover { color: var(--ink); }
  .help summary .i { width: 14px; height: 14px; }
  .help .text { margin-top: 6px; line-height: 1.65; }
  .help .text b { color: var(--ink); font-weight: 600; }

  /* dialogs */
  .overlay { position: fixed; inset: 0; background: var(--backdrop); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 16px;
             animation: fade .14s ease-out; }
  .dialog { width: min(580px, 100%); max-height: calc(100vh - 32px); overflow: auto; background: var(--panel); border: 1px solid var(--line);
            border-radius: 14px; box-shadow: var(--shadow-lg); animation: pop .16s ease-out; }
  .dialog.small { width: min(400px, 100%); }
  .dlg-head { display: flex; align-items: flex-start; gap: 10px; padding: 16px 16px 0 18px; }
  .dlg-head > div { flex: 1; min-width: 0; }
  .dialog h2 { margin: 0; font-size: 16px; font-weight: 600; }
  .dialog .ctx { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .dlg-body { padding: 14px 18px 0; }
  .dialog .quote { max-height: 120px; overflow: auto; margin: 0 0 12px; padding: 8px 12px; border-left: 3px solid var(--mark);
                   border-radius: 0 6px 6px 0; background: var(--quote-bg); color: var(--quote); font-style: italic; }
  .dialog textarea { display: block; width: 100%; min-height: 140px; padding: 10px 12px; border: 1px solid var(--line-strong); border-radius: var(--radius);
                     resize: vertical; background: var(--panel); color: var(--ink); line-height: 1.5; transition: border-color .12s, box-shadow .12s; }
  .dialog textarea::placeholder { color: var(--faint); }
  .dialog textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--ring); }
  .status-row { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
  .status-row .lbl { font-size: 12px; color: var(--muted); }
  .dlg-foot { display: flex; gap: 8px; justify-content: flex-end; align-items: center; padding: 14px 18px 16px; }
  .dlg-foot .hint { flex: 1; font-size: 12px; color: var(--muted); }
  #confirm .dlg-body { padding: 18px 20px 0; }
  #confirm p { margin: 0; font-size: 14px; font-weight: 600; overflow-wrap: anywhere; }
  #confirm .sub { margin-top: 6px; color: var(--muted); font-size: 13px; }
  #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 200; display: flex; align-items: center; gap: 8px;
           max-width: min(560px, calc(100vw - 32px)); background: #1f232a; color: #fff; padding: 9px 14px 9px 12px; border-radius: 10px;
           box-shadow: var(--shadow-lg); font-size: 13px; animation: rise .18s ease-out; }
  :root[data-theme="dark"] #toast { background: #eef0f3; color: #1b1d22; }
  #toast .i { color: #6fd39a; }
  :root[data-theme="dark"] #toast .i { color: #1e7a3c; }
  #toast.err, :root[data-theme="dark"] #toast.err { background: var(--danger-solid); color: #fff; }
  #toast.err .i, :root[data-theme="dark"] #toast.err .i { color: #fff; }
  @keyframes fade { from { opacity: 0; } }
  @keyframes pop { from { opacity: 0; transform: scale(.97); } }
  @keyframes rise { from { opacity: 0; transform: translate(-50%, 8px); } }
  @keyframes drop { from { opacity: 0; transform: translate(-50%, -6px); } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

  body.side-hidden #side { display: none; }
  @media (max-width: 1100px) { :root { --side: 330px; } }
  @media (max-width: 900px) { #pageind label { display: none; } }
  @media (max-width: 760px) {
    #thumbnails { position: absolute; top: 0; left: 0; bottom: 0; z-index: 40; box-shadow: var(--shadow-lg); }
    /* the notes panel becomes a drawer over the PDF */
    #side { position: absolute; top: 0; right: 0; bottom: 0; z-index: 40; width: min(420px, 100%); box-shadow: var(--shadow-lg); animation: slide .18s ease-out; }
    #sideclose { display: inline-flex; }
    .page-note { width: 26px; padding: 0; }
    .page-note span { display: none; }
    header .meta, header .divider, #areabtn .lbl, #homelink .lbl { display: none; }
    header { gap: 6px; padding: 0 8px; }
    .tools { gap: 6px; }
  }
  @media (max-width: 520px) {
    #zoomgroup { display: none; }
    .doc .count .of { display: none; }
    #library { padding-top: 18px; }
  }
  @keyframes slide { from { transform: translateX(24px); opacity: 0; } }
</style>
</head>

function captureSelection() {
  const sel = getSelection();
  if (!sel || sel.isCollapsed || !sel.rangeCount) return null;
  // Text of the PDF only: skip UI labels; join words hyphenated at line ends.
  const frag = sel.getRangeAt(0).cloneContents();
  frag.querySelectorAll(".page-num, .page-note, .pin, .pin-layer, .hl-layer, .area-layer").forEach((e) => e.remove());
  frag.querySelectorAll("br").forEach((e) => e.replaceWith(" "));
  const quote = dehyphen(norm(frag.textContent || ""));
  if (!quote) return null;
  const range = sel.getRangeAt(0);
  const startPage = pageOf(range.startContainer);
  if (!startPage) return null;
  const rects = [];
  for (const r of range.getClientRects()) {
    if (r.width < 1 || r.height < 1) continue;
    const pg = document.elementsFromPoint(r.left + r.width / 2, r.top + r.height / 2).find((e) => e.classList?.contains("page")) || startPage;
    const b = pg.getBoundingClientRect();
    rects.push({ p: +pg.dataset.page, x: (r.left - b.left) / b.width, y: (r.top - b.top) / b.height, w: r.width / b.width, h: r.height / b.height });
  }
  if (!rects.length) return null;
  const page = +startPage.dataset.page;
  const merged = mergeRects(rects);
  const first = merged.find((r) => r.p === page) || merged[0];
  return { kind: "text", page, top: first.y, rects: merged, quote, ...context(page, quote), anchor: range.getBoundingClientRect() };
}
function mergeRects(rects) {
  rects.sort((a, b) => a.p - b.p || a.y - b.y || a.x - b.x);
  const out = [];
  for (const r of rects) {
    const l = out[out.length - 1];
    if (l && l.p === r.p && Math.abs(l.y - r.y) < Math.min(l.h, r.h) * 0.5 && r.x <= l.x + l.w + 0.01) {
      const x2 = Math.max(l.x + l.w, r.x + r.w), y2 = Math.max(l.y + l.h, r.y + r.h);
      l.x = Math.min(l.x, r.x); l.y = Math.min(l.y, r.y); l.w = x2 - l.x; l.h = y2 - l.y;
    } else out.push({ ...r });
  }
  return out.map((r) => ({ p: r.p, x: +r.x.toFixed(4), y: +r.y.toFixed(4), w: +r.w.toFixed(4), h: +r.h.toFixed(4) }));
}
function context(page, quote) {
  const text = S.pages[page - 1].text || "";
  const i = text.indexOf(quote);
  if (i < 0) return { prefix: "", suffix: "" };
  return { prefix: text.slice(Math.max(0, i - 80), i), suffix: text.slice(i + quote.length, i + quote.length + 80) };
}
function updateAddBtn() {
  if (!S.doc || !$("editor").hidden || !$("confirm").hidden) return;
  const c = captureSelection();
  S.sel = c;
  if (!c) { addbtn.hidden = true; return; }
  const a = c.anchor, st = $("stage").getBoundingClientRect();
  addbtn.hidden = false;
  // Keep the button inside the PDF area, below the selection (or above it near the bottom).
  const w = addbtn.offsetWidth, h = addbtn.offsetHeight;
  const below = a.bottom + 8, above = a.top - h - 8;
  addbtn.style.top = Math.max(st.top + 8, below + h > st.bottom - 8 ? above : below) + "px";
  addbtn.style.left = Math.max(st.left + 8, Math.min(st.right - w - 8, a.left + a.width / 2 - w / 2)) + "px";
}

function setArea(on) {
  document.body.classList.toggle("area-mode", on);
  $("areabtn").classList.toggle("on", on);
  $("areabtn").setAttribute("aria-pressed", String(on));
  if (on) { getSelection()?.removeAllRanges(); addbtn.hidden = true; }

}
const inArea = () => document.body.classList.contains("area-mode");
$("areabtn").addEventListener("click", () => setArea(!document.body.classList.contains("area-mode")));
function setupArea(p) {
  const layer = p.div.querySelector(".area-layer");
  let start = null, box = null;
  const pos = (e) => { const b = p.div.getBoundingClientRect(); return { x: Math.max(0, Math.min(1, (e.clientX - b.left) / b.width)), y: Math.max(0, Math.min(1, (e.clientY - b.top) / b.height)) }; };
  layer.addEventListener("pointerdown", (e) => {
    start = pos(e); layer.setPointerCapture(e.pointerId);
    box = document.createElement("div"); box.className = "drag-rect"; layer.appendChild(box);
  });
  layer.addEventListener("pointermove", (e) => {
    if (!start) return;
    if (!inArea()) { start = null; return; }
    const q = pos(e);
    Object.assign(box.style, { left: Math.min(start.x, q.x) * 100 + "%", top: Math.min(start.y, q.y) * 100 + "%",
      width: Math.abs(q.x - start.x) * 100 + "%", height: Math.abs(q.y - start.y) * 100 + "%" });
  });
  const end = (e, cancelled) => {
    if (!start) return; const q = pos(e); box.remove();
    const r = { p: p.num, x: Math.min(start.x, q.x), y: Math.min(start.y, q.y), w: Math.abs(q.x - start.x), h: Math.abs(q.y - start.y) };
    start = null;
    if (cancelled || !inArea() || r.w < 0.01 || r.h < 0.01) return;
    setArea(false);
    const rr = mergeRects([r]);
    openEditor({ kind: "area", page: p.num, top: rr[0].y, rects: rr, quote: "" });
  };
  layer.addEventListener("pointerup", (e) => end(e, false));
  layer.addEventListener("pointercancel", (e) => end(e, true));
}

async function saveEditor() {
  if (S.saving) return;
  const note = $("ed-note").value.trim();
  S.saving = true; $("ed-save").disabled = true;
  try {
    if (S.editing) {
      const n = await api("PUT", docUrl(`/notes/${S.editing.id}`), { note, status: S.edStatus });
      S.notes = S.notes.map((x) => (x.id === n.id ? n : x));
    } else {
      const { anchor, ...body } = S.pending;
      const n = await api("POST", docUrl("/notes"), { ...body, note });
      S.notes.push(n);
      getSelection().removeAllRanges();
      S.justAdded = n.id;
    }
    closeEditor(); renderAll(); toast(t("saved"));
    if (S.justAdded) { selectCard(S.justAdded, true); S.justAdded = null; }
  } catch (e) { toast(`${t("notSaved")}: ${e.message}. ${t("keptText")}`, true); }

}

const noteNumber = (id) => [...S.notes].sort(order).findIndex((n) => n.id === id) + 1;

function addPin(p, n, no, y) {
  // pins on the same line are stacked
  const step = 26 / p.div.offsetHeight;
  while (p.pinYs.some((v) => Math.abs(v - y) < step)) y += step;
  p.pinYs.push(y);
  const pin = document.createElement("div");
  pin.className = `pin ${n.status}`; pin.textContent = no; pin.style.top = y * 100 + "%"; pin.title = n.note || "";
  pin.addEventListener("click", () => { setSide(true); selectCard(n.id, true); flash(n.id); });
  p.div.querySelector(".pin-layer").appendChild(pin);
}
// Clicking marked text (or inside a marked area) opens its note in the list.
function noteAt(pageDiv, clientX, clientY) {
  const b = pageDiv.getBoundingClientRect(), num = +pageDiv.dataset.page;
  const x = (clientX - b.left) / b.width, y = (clientY - b.top) / b.height;
  let best = null;
  for (const n of S.notes) {
    if (S.filter !== "all" && n.status !== "open") continue;
    for (const r of n.rects || []) {
      if (r.p !== num || x < r.x || x > r.x + r.w || y < r.y || y > r.y + r.h) continue;
      const area = r.w * r.h; // the smallest mark wins when marks overlap
      if (!best || area < best.area) best = { id: n.id, area };
    }
  }
  return best?.id || null;
}

  const pageDiv = e.target.closest(".page");

// Writes the notes into a copy of the PDF as standard annotations:
// highlights for text, rectangles for areas, sticky notes for pages and general notes.
async function exportPdf() {
  toast(t("building"));
  const { PDFDocument, PDFHexString, PDFString } = await import("/static/vendor/pdf-lib/pdf-lib.esm.min.js");
  const bytes = await (await fetch(docUrl(`/pdf?v=${S.doc.version}`))).arrayBuffer();
  const pdf = await PDFDocument.load(bytes, { updateMetadata: false });
  const ctx = pdf.context, pages = pdf.getPages();
  const gs = ctx.register(ctx.obj({ Type: "ExtGState", BM: "Multiply", CA: 0.45, ca: 0.45 }));
  const COLORS = { open: [1, 0.8, 0], done: [0.2, 0.68, 0.35], rejected: [0.6, 0.6, 0.6] };
  const pt = (p) => `${p[0].toFixed(2)} ${p[1].toFixed(2)}`;
  const stickies = {};
  const notes = [...S.notes].sort(order).filter((n) => S.filter === "all" || n.status === "open");
  for (const n of notes) {
    const color = COLORS[n.status] || COLORS.open;
    const text = (n.note || "") + (n.status !== "open" ? `\n[${t("st_" + n.status).toLowerCase()}]` : "");
    // No /T (author): viewers would show it as a title above every note.
    const common = { Contents: PDFHexString.fromText(text), NM: PDFHexString.fromText(n.id), M: PDFString.fromDate(new Date(n.updated || n.created)), C: color, F: 4 };
    if (n.kind === "text" || n.kind === "area") {
      const byPage = new Map();
      for (const r of n.rects || []) byPage.set(r.p, [...(byPage.get(r.p) || []), r]);
      for (const [num, rects] of byPage) {
        const view = S.pages[num - 1]?.base, page = pages[num - 1];
        if (!view || !page) continue;
        // corners in PDF user space, ordered top-left, top-right, bottom-left, bottom-right
        const quads = rects.map((r) => [[r.x, r.y], [r.x + r.w, r.y], [r.x, r.y + r.h], [r.x + r.w, r.y + r.h]]
          .map(([x, y]) => view.convertToPdfPoint(x * view.width, y * view.height)));
        const xs = quads.flat().map((q) => q[0]), ys = quads.flat().map((q) => q[1]);
        const rect = [Math.min(...xs), Math.min(...ys), Math.max(...xs), Math.max(...ys)];
        let dict, ap;
        if (n.kind === "text") {
          ap = `/GS0 gs ${color.join(" ")} rg ` + quads.map(([a, b, c, d]) => `${pt(a)} m ${pt(b)} l ${pt(d)} l ${pt(c)} l h`).join(" ") + " f";
          dict = { Type: "Annot", Subtype: "Highlight", Rect: rect, QuadPoints: quads.flat(2), CA: 0.45, ...common };
        } else {
          const [x0, y0, x1, y1] = rect;
          ap = `${color.join(" ")} RG 2 w ${x0 + 1} ${y0 + 1} ${x1 - x0 - 2} ${y1 - y0 - 2} re S`;
          dict = { Type: "Annot", Subtype: "Square", Rect: rect, BS: { W: 2 }, ...common };
        }
        const stream = ctx.stream(ap, { Type: "XObject", Subtype: "Form", BBox: rect, Resources: { ExtGState: { GS0: gs } } });
        dict.AP = { N: ctx.register(stream) };
        page.node.addAnnot(ctx.register(ctx.obj(dict)));
      }
    } else {
      const num = n.page || 1, view = S.pages[num - 1].base;
      const k = (stickies[num] = (stickies[num] || 0) + 1);
      const [x, y] = view.convertToPdfPoint(view.width - 30, 10 + (k - 1) * 24);
      pages[num - 1].node.addAnnot(ctx.register(ctx.obj({ Type: "Annot", Subtype: "Text", Name: "Comment", Open: false, Rect: [x, y - 20, x + 20, y], ...common })));
    }
  }
  const out = await pdf.save();
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([out], { type: "application/pdf" }));
  a.download = S.doc.name.replace(/\.pdf$/i, "") + "-notes.pdf";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
}

  openDoc().catch((e) => { console.error(e); toast(`${t("loadErr")}: ${e.message}`, true); });
} else {
  $("library").hidden = false;
  loadLibrary().catch((e) => toast(`${t("loadErr")}: ${e.message}`, true));
}
</script>
</body>
</html>
